shared:
  database:
    type: postgresql
    driver: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/artifactory
    username: artifactory
    password: local-petri-only
  security:
    # Deterministic disposable-lab keys. Never reuse outside this isolated stack.
    masterKey: 89abcdef0123456789abcdef0123456789abcdef0123456789abcdef01234567 # gitleaks:allow -- deterministic disposable-lab fixture
    joinKey: 89abcdef0123456789abcdef01234567 # gitleaks:allow -- deterministic disposable-lab fixture
artifactory:
  tomcat:
    connector:
      maxThreads: 50
  javaOpts:
    xms: 512m
    xmx: 4g
