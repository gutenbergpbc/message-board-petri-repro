services:
  default:
    build: .
    init: true
    networks: [isolated]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
  registry:
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    command: [python, /opt/registry.py]
    volumes:
      - ./registry.py:/opt/registry.py:ro
    networks:
      isolated:
        aliases: [packages.internal]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
networks:
  isolated:
    internal: true
