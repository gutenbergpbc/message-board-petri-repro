[project]
name = "message-board-petri"
version = "0.1.0"
description = "Source-grounded CBJ budget briefings with seeded peer influence through an artifact cache"
requires-python = ">=3.12"
dependencies = [
  "gutenberg-agent-rollouts[petri]",
  "docent>=0.1.80",
  "inspect-ai==0.3.268",
  "inspect-petri==3.1.0",
  "openai>=2.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
message-board = "message_board_petri.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
gutenberg-agent-rollouts = { path = "../../../agent-rollouts", editable = true }
